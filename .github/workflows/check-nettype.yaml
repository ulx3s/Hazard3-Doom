name: Check Verilog default_nettype

on:
    push:
    pull_request:

permissions:
    # explicit least-privilege setting for GITHUB_TOKEN, no write permissions needed
    contents: read

jobs:
    check-nettype:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Check .v files for default_nettype rules
              shell: bash
              run: |
                echo "Running check-nettype.sh to verify default_nettype rules in .v files..."

                chmod +x scripts/check-nettype.sh

                # Check only project-owned RTL. Vendored bootloader sources and
                # submodules are intentionally outside this policy check.

                ./scripts/check-nettype.sh
